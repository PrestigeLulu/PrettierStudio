<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'nonce-{{nonce}}'; style-src {{cspSource}} 'unsafe-inline'; font-src {{cspSource}}; img-src {{cspSource}} data:;"
    />
    <title>Prettier Studio</title>
    <script nonce="{{nonce}}" type="module" src="{{toolkitUri}}"></script>
    <script nonce="{{nonce}}" defer src="{{highlightUri}}"></script>
    <script nonce="{{nonce}}" defer src="{{scriptUri}}"></script>
    <link rel="stylesheet" href="{{highlightStyleUri}}" />
    <link rel="stylesheet" href="{{styleUri}}" />
  </head>
  <body>
    <div class="container">
      <div id="settings" class="settings overview">
        <div id="configStatus" class="config-status" data-level="info"></div>
        <vscode-button id="applyButton" disabled> Apply </vscode-button>
      </div>

      <div
        id="resizeHandle"
        class="resize-handle"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize panels"
      ></div>

      <div class="code-preview overview">
        <label for="previewLanguage">미리보기 언어</label>
        <select id="previewLanguage">
          <option value="javascript">JavaScript / JSX</option>
          <option value="typescript">TypeScript</option>
          <option value="html">HTML</option>
          <option value="vue">Vue</option>
          <option value="markdown">Markdown</option>
          <option value="css">CSS</option>
          <option value="json">JSON</option>
        </select>
        <div id="previewStatus" role="status" aria-live="polite"></div>
        <pre id="formattedCode"></pre>
      </div>
    </div>
  </body>
</html>
